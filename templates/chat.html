{% extends "base.html" %}

{% block page_content %}
<div class="page-header">
    <h1>Hello, {{ name }}! Welcome to PRA3 Docker!</h1>
    <h2>Your UofT email is {{ email }}.</h2>
</div>

<h3>Chatbot with Memory</h3>

<p>
    Try “My name is Alice.” and then “What is my name?”
</p>

<div
    id="conversation"
    class="well"
    role="log"
    aria-live="polite"
></div>

<form id="chat-form">
    <div class="form-group">
        <label for="message">Message</label>
        <input
            type="text"
            id="message"
            class="form-control"
            placeholder="Type a message"
            maxlength="500"
            required
        >
    </div>

    <button type="submit" id="send-button" class="btn btn-primary">
        Send
    </button>
</form>

<hr>

<form action="{{ url_for('logout') }}" method="post">
    <button type="submit" class="btn btn-default">
        Logout
    </button>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}

<script>
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message");
    const conversation = document.getElementById("conversation");
    const sendButton = document.getElementById("send-button");

    function addMessage(sender, text) {
        const line = document.createElement("p");
        line.textContent = `${sender}: ${text}`;
        conversation.appendChild(line);
    }

    chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        addMessage("You", message);
        messageInput.value = "";
        sendButton.disabled = true;

        try {
            const response = await fetch(
                {{ url_for('chat') | tojson }},
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                }
            );

            const data = await response.json();
            addMessage("Bot", data.reply);
        } catch (error) {
            addMessage("Bot", "Unable to send the message. Please try again.");
        } finally {
            sendButton.disabled = false;
            messageInput.focus();
        }
    });
</script>
{% endblock %}
